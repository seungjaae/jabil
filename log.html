<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>작업 일지 — 골목집사</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0f172a">

  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="topbar">
    <a class="topbar__brand" href="index.html">← 골목집사</a>
    <div class="topbar__right">
      <span class="chip">내부용</span>
    </div>
  </header>

  <main class="section">
    <div class="wrap">
      <p class="section__label">작업 일지</p>
      <h1 class="section__title">한 건 끝날 때마다 3줄만 남깁니다</h1>
      <p class="section__desc">
        여기 쌓인 시간 데이터가 <strong>가격표와 구독료의 근거</strong>가 됩니다.
        기록은 이 폰(브라우저)에만 저장되니, 가끔 CSV로 내려받아 백업하세요.
      </p>

      <!-- 입력 -->
      <form class="logform" id="log-form">
        <div class="logform__row">
          <label class="field">
            <span class="field__label">작업 종류</span>
            <select class="field__input" id="f-task" required></select>
          </label>

          <label class="field field--sm">
            <span class="field__label">인원</span>
            <select class="field__input" id="f-people">
              <option value="1">1인</option>
              <option value="2">2인</option>
            </select>
          </label>
        </div>

        <div class="logform__row">
          <label class="field field--sm">
            <span class="field__label">예상 시간 (분)</span>
            <input class="field__input" id="f-expected" type="number" min="1" max="600" required>
          </label>

          <label class="field field--sm">
            <span class="field__label">실제 걸린 시간 (분)</span>
            <input class="field__input" id="f-actual" type="number" min="1" max="600" required>
          </label>

          <label class="field field--sm">
            <span class="field__label">이동 시간 (분)</span>
            <input class="field__input" id="f-travel" type="number" min="0" max="600" value="0">
          </label>
        </div>

        <label class="field">
          <span class="field__label">배운 것 · 다음엔 이렇게</span>
          <textarea class="field__input" id="f-note" rows="2"
                    placeholder="예: 석고보드가 9.5mm라 앵커가 헐거웠음. 다음엔 두께 먼저 확인"></textarea>
        </label>

        <button class="btn btn--primary" type="submit">기록 저장</button>
      </form>

      <!-- 통계 -->
      <h2 class="logsub">작업별 평균</h2>
      <p class="logsub__desc">
        이 표의 <strong>평균 실제</strong> + <strong>평균 이동</strong> 이 원가 계산의 입력값입니다.
        (사업계획서 6-3 참고)
      </p>
      <div class="logtable-wrap">
        <table class="logtable" id="stat-table"></table>
      </div>

      <!-- 기록 목록 -->
      <h2 class="logsub">전체 기록 <span class="logsub__count" id="log-count"></span></h2>
      <div class="logtable-wrap">
        <table class="logtable" id="log-table"></table>
      </div>

      <div class="logactions">
        <button class="btn btn--ghost" id="export-csv" type="button">CSV로 내려받기</button>
        <button class="btn btn--ghost btn--danger" id="clear-all" type="button">전체 삭제</button>
      </div>
    </div>
  </main>

  <script src="data/site-data.js"></script>
  <script src="js/log.js"></script>
</body>
</html>
